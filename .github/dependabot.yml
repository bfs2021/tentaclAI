version: 2
updates:
  # Python packages of tentacontrol: only when a new version falls outside the allowed range
  - package-ecosystem: pip
    directory: /control
    versioning-strategy: increase-if-necessary
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /control
    schedule:
      interval: monthly
  # sandbox base image: stay on the Node LTS line – major versions are switched deliberately
  - package-ecosystem: docker
    directory: /build
    schedule:
      interval: monthly
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  # egress gateway base image
  - package-ecosystem: docker
    directory: /egress
    schedule:
      interval: monthly
  # test dependencies (scripts/test-quick.sh)
  - package-ecosystem: pip
    directory: /tests
    versioning-strategy: increase-if-necessary
    schedule:
      interval: monthly
  # GitHub Actions used by the CI (keeps them on a supported Node runtime)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
