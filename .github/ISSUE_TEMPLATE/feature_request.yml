name: Feature request
description: Idea for a new feature, service type or template
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The use case – what should Claude or tentacontrol be able to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How could it work? (optional)
