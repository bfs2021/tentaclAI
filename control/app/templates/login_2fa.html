<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · tentaclAI</title>
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg?v={{ asset_v }}">
  <link rel="stylesheet" href="/static/app.css?v={{ asset_v }}">
</head>
<body>
<div class="auth">
  <form class="card" method="post" action="/login/2fa" autocomplete="off">
    <div class="brand"><img class="logo" src="/static/logo.svg?v={{ asset_v }}" alt="" width="32" height="32"><div>tentacl<span class="ai-grad">AI</span><small>Long arms, one brain – safely caged</small></div></div>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <div class="field">
      <label for="code">Code from your authenticator app</label>
      <input id="code" type="text" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="9" autofocus required class="mono">
      <div class="help">Lost the phone? Enter one of your recovery codes instead.</div>
    </div>
    <label class="check" style="margin:4px 0 12px"><input type="checkbox" name="trust" value="1"> Trust this browser for {{ days }} days</label>
    <button class="btn primary" style="width:100%;justify-content:center">Sign in</button>
    <details class="help forgot" style="margin-top:14px">
      <summary>No phone and no recovery code?</summary>
      <p>Switch two-factor sign-in off on the host: <code>./tentaclai.sh reset-2fa</code> – then sign in with the password and set it up again.</p>
    </details>
  </form>
</div>
</body>
</html>
