<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Setup · tentaclAI</title>
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg?v={{ asset_v }}">
  <link rel="stylesheet" href="/static/app.css?v={{ asset_v }}">
</head>
<body>
<div class="auth">
  <form class="card" method="post" action="/setup">
    <div class="brand"><img class="logo" src="/static/logo.svg?v={{ asset_v }}" alt="" width="32" height="32"><div>Set up tentaclAI</div></div>
    <p class="muted small">Choose the admin password. The setup token is in the container log:<br><code>./tentaclai.sh setup-url</code> or <code>docker logs tentacontrol</code></p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <div class="field">
      <label for="tk">Setup token</label>
      <input id="tk" type="text" name="token" value="{{ token }}" autocomplete="off" required>
    </div>
    <div class="field">
      <label for="pw">New password</label>
      <input id="pw" type="password" name="password" minlength="10" autocomplete="new-password" required>
      <div class="help">at least 10 characters</div>
    </div>
    <div class="field">
      <label for="pw2">Repeat</label>
      <input id="pw2" type="password" name="password2" minlength="10" autocomplete="new-password" required>
    </div>
    <button class="btn primary" style="width:100%;justify-content:center">Set password</button>
  </form>
</div>
</body>
</html>
