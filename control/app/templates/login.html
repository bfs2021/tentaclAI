<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · tentaclAI</title>
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg?v={{ asset_v }}">
  <link rel="stylesheet" href="/static/app.css?v={{ asset_v }}">
</head>
<body>
<div class="auth">
  <form class="card" method="post" action="/login">
    <div class="brand"><img class="logo" src="/static/logo.svg?v={{ asset_v }}" alt="" width="32" height="32"><div>tentacl<span class="ai-grad">AI</span><small>Long arms, one brain – safely caged</small></div></div>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <div class="field">
      <label for="pw">Password</label>
      <input id="pw" type="password" name="password" autocomplete="current-password" autofocus required>
    </div>
    <button class="btn primary" style="width:100%;justify-content:center">Sign in</button>
    <p class="help" style="margin-top:14px">Forgot the password? On the host: <code>./tentaclai.sh passwd</code> or <code>docker exec -it tentacontrol tentacontrol-passwd</code></p>
  </form>
</div>
</body>
</html>
