<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · tentaclaude</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐙</text></svg>">
  <link rel="stylesheet" href="/static/app.css?v={{ asset_v }}">
</head>
<body>
<div class="auth">
  <form class="card" method="post" action="/login">
    <div class="brand"><div class="logo">🐙</div><div>tentaclaude<small>Eight arms, one brain</small></div></div>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <div class="field">
      <label for="pw">Password</label>
      <input id="pw" type="password" name="password" autocomplete="current-password" autofocus required>
    </div>
    <button class="btn primary" style="width:100%;justify-content:center">Sign in</button>
    <p class="help" style="margin-top:14px">Forgot the password? On the host: <code>./tentaclaude.sh passwd</code> or <code>docker exec -it tentacontrol tentacontrol-passwd</code></p>
  </form>
</div>
</body>
</html>
